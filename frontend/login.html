<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Estúdio de Tatuagem</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    
    <!-- Tipografia Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- CSS Global do Projeto -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="auth-bento-body">

    <!-- Ambient Ambient Glow Background -->
    <div class="auth-ambient-glow"></div>

    <main class="auth-bento-container">
      <div class="auth-bento-card">
        
        <!-- Logo / Ícone de Tatuagem Centrado -->
        <div class="auth-bento-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="3" width="3" height="6" rx="1"/>
            <rect x="11" y="3" width="3" height="6" rx="1"/>
            <path d="M8 5h3m3 0h4v3h-4M5 9h10l4 3-5 4-4-4H5zM8 12l-3 5h4l3-4M5 17l-2 4M7 17l-1 4"/>
          </svg>
        </div>

        <h1 class="auth-bento-title">Estúdio Tatuagem</h1>
        <p class="auth-bento-subtitle">Entre para acessar seu painel de controle</p>

        <!-- Formulário de Login com IDs e Funcionalidades Mantidas -->
        <form id="form-login" class="auth-form-clean">
          
          <div class="input-field-block">
            <label for="email" class="form-label">E-mail</label>
            <div class="input-group-icon">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
              <input type="email" id="email" class="form-control input-with-icon" placeholder="seu@email.com" required />
            </div>
          </div>

          <div class="input-field-block">
            <label for="senha" class="form-label">Senha</label>
            <div class="input-group-icon">
              <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="senha" class="form-control input-with-icon input-with-eye" placeholder="••••••••" required />
              
              <!-- Botão para Alternar Visibilidade da Senha -->
              <button type="button" class="btn-toggle-eye" onclick="togglePasswordVisibility('senha', this)" aria-label="Mostrar Senha">
                <svg class="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg class="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display: none;">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-full">Entrar</button>
        </form>

        <p class="auth-bento-footer">
          Não tem uma conta? <a href="cadastro.html" class="auth-link">Cadastre-se grátis</a>
        </p>
      </div>
    </main>

    <!-- Scripts de Funcionalidades -->
    <script src="js/modais.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
