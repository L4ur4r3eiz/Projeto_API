<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Estúdio de Tatuagem — Gestão & Arte</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    
    <!-- Tipografia Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- CSS Global -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="landing-body">

    <!-- 1. PRELOADER / INTRO ANIMADA (SPLASH SCREEN) -->
    <div id="app-preloader" class="preloader-overlay">
      <div class="preloader-content">
        <div class="preloader-symbol">
          <svg viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2">
            <rect x="5" y="3" width="3" height="6" rx="1"/>
            <rect x="11" y="3" width="3" height="6" rx="1"/>
            <path d="M8 5h3m3 0h4v3h-4M5 9h10l4 3-5 4-4-4H5zM8 12l-3 5h4l3-4M5 17l-2 4M7 17l-1 4"/>
          </svg>
        </div>
        <span class="preloader-brand-name">ESTÚDIO TATUAGEM</span>
        <div class="preloader-progress-bar">
          <div class="preloader-progress-fill"></div>
        </div>
      </div>
    </div>

    <!-- 2. NAVBAR FLUTUANTE -->
    <header class="navbar-wrapper">
      <nav class="navbar">
        <a href="index.html" class="navbar-brand" aria-label="Home">
          <svg class="brand-symbol" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2">
            <rect x="5" y="3" width="3" height="6" rx="1"/>
            <rect x="11" y="3" width="3" height="6" rx="1"/>
            <path d="M8 5h3m3 0h4v3h-4M5 9h10l4 3-5 4-4-4H5zM8 12l-3 5h4l3-4M5 17l-2 4M7 17l-1 4"/>
          </svg>
          <span class="brand-text-label">Estúdio Tatuagem</span>
        </a>
        
        <button type="button" class="nav-toggle-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="nav-links" data-nav-toggle>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>

        <div class="nav-links" id="nav-links">
          <a href="login.html" class="btn-table-edit" style="height: 34px; padding: 0 1.25rem;">Entrar</a>
        </div>
      </nav>
    </header>

    <!-- 3. HERO SECTION / CONTEÚDO PRINCIPAL -->
    <main class="hero-container">
      <!-- Auras de fundo com tamanho travado -->
      <div class="hero-ambient-glow"></div>
      <div class="hero-halftone-grid"></div>

      <div class="hero-content">
        <div class="hero-badge">
          <span class="badge-dot"></span>
          <span>Plataforma de Gestão Artística</span>
        </div>

        <h1 class="hero-title">
          Seu estúdio, <br>
          <span class="text-gradient">organizado do seu jeito.</span>
        </h1>
        
        <p class="hero-subtitle">
          Controle agendamentos, equipe artística, clientes e estilos em uma plataforma com design dark moderno e ágil.
        </p>

        <div class="hero-actions">
          <a href="cadastro.html" class="btn btn-primary hero-btn-main">
            <span>Comece agora</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          </a>
          <a href="login.html" class="btn-table-edit hero-btn-sub">
            Acessar conta
          </a>
        </div>
      </div>
    </main>

    <!-- Script de Animação da Intro -->
    <script src="js/navbar.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
